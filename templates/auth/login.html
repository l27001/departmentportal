<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | ИС Кафедра</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>Вход в систему</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="login-flash">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form action="/auth/login" method="POST" class="login-form">
      <div class="input-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" name="email" required placeholder="Введите ваш email">
      </div>
      <div class="input-group">
        <label for="password">Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required placeholder="Введите ваш пароль">
          <button type="button" class="password-toggle" onclick="togglePw('password', this)">👁</button>
        </div>
      </div>
      <button type="submit" class="login-btn">Войти</button>
    </form>
  </div>
  <script src="/static/js/scripts.js"></script>
</body>
</html>
