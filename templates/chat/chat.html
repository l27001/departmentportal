{% extends 'base.html' %}

{% block title %}Чат{% endblock %}

{% block extracss %}
<style>
  .container {
    max-width: 600px;
  }
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
  <div class="chat-header">
    <h2>Общий чат</h2>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-file-preview" id="chatFilePreview"></div>
  <div class="chat-input-area" style="position:relative;">
    <div id="emojiPicker" class="emoji-picker" style="display:none;"></div>
    <button type="button" onclick="toggleEmojiPicker()" style="flex-shrink:0; width:42px; height:42px; padding:0; border:1px solid #ddd; border-radius:50%; background:#f8f9fa; cursor:pointer; font-size:20px; line-height:42px; text-align:center;">😊</button>
    <label class="chat-file-btn" title="Прикрепить файл">
      <input type="file" id="chatFileInput" multiple hidden>
      <span>📎</span>
    </label>
    <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" style="flex:1;">
    <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">Отправить</button>
  </div>
</div>

<div id="imagePreviewModal" class="modal" style="align-items:center;justify-content:center;background-color:rgba(0,0,0,0.85);" onclick="closeModal('imagePreviewModal')">
  <span class="close" onclick="closeModal('imagePreviewModal')" style="position:fixed;top:20px;right:30px;z-index:1001;font-size:40px;color:#fff;cursor:pointer;opacity:0.8;line-height:1;">&times;</span>
  <img id="imagePreviewImg" src="" alt="" style="max-width:90vw;max-height:90vh;object-fit:contain;box-shadow:0 4px 20px rgba(0,0,0,0.5);border-radius:4px;" onclick="event.stopPropagation()">
</div>
{% endblock %}

{% block extrajs %}
<script>
var currentUserId = null;
var pollInterval = null;
var pendingFiles = [];
var knownMessageIds = new Set();

function loadUserId() {
  fetch('/api/auth/me', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(user) {
    currentUserId = user.id;
    loadMessages();
    pollInterval = setInterval(loadMessages, 3000);
  });
}

function loadMessages() {
  fetch('/api/chat/messages?per_page=100', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var messages = data.messages || data;
    var container = document.getElementById('chatMessages');
    var wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;
    var firstLoad = knownMessageIds.size === 0;
    if (!messages || messages.length === 0) {
      if (firstLoad) container.innerHTML = '<div class="chat-empty">Сообщений пока нет</div>';
      return;
    }
    if (firstLoad) container.innerHTML = '';
    messages.forEach(function(m) {
      if (!knownMessageIds.has(m.id)) {
        knownMessageIds.add(m.id);
        container.insertAdjacentHTML('beforeend', renderOneMessage(m));
      }
    });
    if (wasAtBottom || firstLoad) {
      container.scrollTop = container.scrollHeight;
    }
  });
}

function renderOneMessage(m) {
  var isOwn = m.author_id === currentUserId;
  var date = new Date(m.created_at);
  var time = date.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  var html = '<div class="chat-message ' + (isOwn ? 'chat-message-own' : 'chat-message-other') + '">';
  html += '<div class="chat-message-author">' + m.author_name + '</div>';
  if (m.text) {
    html += '<div class="chat-message-text">' + escapeHtml(m.text) + '</div>';
  }
  if (m.attachments && m.attachments.length > 0) {
    html += '<div class="chat-attachments">';
    for (var j = 0; j < m.attachments.length; j++) {
      var a = m.attachments[j];
      var isImage = a.mime_type && a.mime_type.startsWith('image/');
      html += '<div class="chat-attachment">';
      if (isImage) {
        html += '<img src="/api/attachments/' + a.id + '" class="chat-attach-image" alt="' + escapeHtml(a.file_name) + '" onclick="previewImage(' + a.id + ')" width="200" height="150">';
      } else {
        html += '<a href="/api/attachments/' + a.id + '" target="_blank" class="chat-attach-file">';
        html += '<span class="chat-attach-icon">📄</span>';
        html += '<span class="chat-attach-name">' + escapeHtml(a.file_name) + '</span>';
        html += '<span class="chat-attach-size">' + formatSize(a.size) + '</span>';
        html += '</a>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div class="chat-message-time">' + time + '</div>';
  if (isOwn) {
    html += '<button class="chat-delete-btn" onclick="deleteMessage(' + m.id + ')">✕</button>';
  }
  html += '</div>';
  return html;
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function sendMessage() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  var hasFiles = pendingFiles.length > 0;
  if (!text && !hasFiles) return;
  var btn = document.getElementById('chatSendBtn');
  btn.disabled = true;

  if (hasFiles) {
    var formData = new FormData();
    if (text) formData.append('text', text);
    for (var i = 0; i < pendingFiles.length; i++) {
      formData.append('file', pendingFiles[i]);
    }
    fetch('/api/chat/messages', {
      method: 'POST',
      credentials: 'include',
      body: formData,
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      input.value = '';
      clearPendingFiles();
      btn.disabled = false;
      loadMessages();
    })
    .catch(function() {
      btn.disabled = false;
    });
  } else {
    fetch('/api/chat/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ text: text }),
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      input.value = '';
      btn.disabled = false;
      loadMessages();
    })
    .catch(function() {
      btn.disabled = false;
    });
  }
}

function deleteMessage(id) {
  if (!confirm('Удалить сообщение вместе с файлами?')) return;
  fetch('/api/chat/messages/' + id, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) {
    if (r.ok) loadMessages();
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function previewImage(attachmentId) {
  var modal = document.getElementById('imagePreviewModal');
  var img = document.getElementById('imagePreviewImg');
  img.src = '/api/attachments/' + attachmentId;
  img.onload = function() { modal.style.display = 'flex'; };
}

document.addEventListener('DOMContentLoaded', function() {
  loadUserId();
  buildEmojiPicker();
  document.getElementById('chatFileInput').addEventListener('change', function(e) {
    pendingFiles = Array.from(e.target.files);
    updateFilePreview();
  });
});

function updateFilePreview() {
  var preview = document.getElementById('chatFilePreview');
  if (pendingFiles.length === 0) {
    preview.style.display = 'none';
    preview.innerHTML = '';
    return;
  }
  preview.style.display = 'flex';
  var html = '';
  for (var i = 0; i < pendingFiles.length; i++) {
    html += '<span class="chat-file-preview-item">' + escapeHtml(pendingFiles[i].name) + ' <span class="chat-file-preview-remove" onclick="removePendingFile(' + i + ')">✕</span></span>';
  }
  preview.innerHTML = html;
}

function clearPendingFiles() {
  pendingFiles = [];
  document.getElementById('chatFileInput').value = '';
  updateFilePreview();
}

function removePendingFile(index) {
  pendingFiles.splice(index, 1);
  var dt = new DataTransfer();
  for (var i = 0; i < pendingFiles.length; i++) {
    dt.items.add(pendingFiles[i]);
  }
  document.getElementById('chatFileInput').files = dt.files;
  updateFilePreview();
}

var emojis = ['😀','😁','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😗','😋','😛','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','😐','😑','😶','😏','😒','🙄','😬','😮','😯','😲','😳','🥺','😢','😭','😤','😡','🤬','😈','👍','👎','👊','✊','🤘','👌','✌','🤞','💪','🤝','🙏','❤','💔','🔥','⭐','✅','❌','🎉','🎊','🚀','💡','📌','🎯','💯','👏','🤩','🥳','💀','☠','👋','✋','🙌','🤲','🤜','🤛','🧠','👀','👅','💋'];

function buildEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  for (var i = 0; i < emojis.length; i++) {
    var span = document.createElement('span');
    span.textContent = emojis[i];
    span.onclick = function() { insertEmoji(this.textContent); };
    picker.appendChild(span);
  }
}

function toggleEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  picker.style.display = picker.style.display === 'none' ? 'grid' : 'none';
}

function insertEmoji(emoji) {
  var input = document.getElementById('chatInput');
  input.value += emoji;
  input.focus();
  document.getElementById('emojiPicker').style.display = 'none';
}

document.addEventListener('click', function(e) {
  var picker = document.getElementById('emojiPicker');
  var btn = document.querySelector('.chat-input-area button:first-child');
  if (picker.style.display !== 'none' && !picker.contains(e.target) && !btn.contains(e.target)) {
    picker.style.display = 'none';
  }
});
</script>
{% endblock %}
