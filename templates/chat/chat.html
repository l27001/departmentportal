{% extends 'base.html' %}

{% block title %}Чат{% endblock %}

{% block extracss %}
<style>
.chat-layout {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 160px);
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  overflow: hidden;
}

.chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid #e5e7eb;
  background: #f8f9fa;
}

.chat-header h2 {
  margin: 0;
  font-size: 18px;
  color: #333;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-message {
  display: flex;
  flex-direction: column;
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 12px;
  position: relative;
}

.chat-message-own {
  align-self: flex-end;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.chat-message-other {
  align-self: flex-start;
  background: #f0f2f5;
  color: #333;
  border-bottom-left-radius: 4px;
}

.chat-message-author {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

.chat-message-own .chat-message-author {
  color: rgba(255,255,255,0.8);
}

.chat-message-other .chat-message-author {
  color: #667eea;
}

.chat-message-text {
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}

.chat-message-time {
  font-size: 11px;
  margin-top: 4px;
  opacity: 0.7;
  align-self: flex-end;
}

.chat-input-area {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid #e5e7eb;
  background: #f8f9fa;
}

.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #ddd;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}

.chat-input-area input:focus {
  border-color: #667eea;
}

.chat-send-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.chat-send-btn:hover {
  opacity: 0.9;
}

.chat-send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.chat-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #999;
  font-size: 15px;
}

.chat-delete-btn {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: none;
  background: #e53935;
  color: #fff;
  font-size: 12px;
  line-height: 20px;
  text-align: center;
  cursor: pointer;
  display: none;
  padding: 0;
}

.chat-message:hover .chat-delete-btn {
  display: block;
}

@media (max-width: 768px) {
  .chat-message {
    max-width: 90%;
  }
  .chat-layout {
    height: calc(100vh - 140px);
  }
}
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
  <div class="chat-header">
    <h2>Общий чат</h2>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">Отправить</button>
  </div>
</div>
{% endblock %}

{% block extrajs %}
<script>
var currentUserId = null;
var pollInterval = null;

function loadUserId() {
  fetch('/api/auth/me', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(user) {
    currentUserId = user.id;
    loadMessages();
    pollInterval = setInterval(loadMessages, 3000);
  });
}

function loadMessages() {
  fetch('/api/chat/messages?per_page=100', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderMessages(data.messages || data);
  });
}

function renderMessages(messages) {
  var container = document.getElementById('chatMessages');
  var wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;
  if (!messages || messages.length === 0) {
    container.innerHTML = '<div class="chat-empty">Сообщений пока нет</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    var isOwn = m.author_id === currentUserId;
    var date = new Date(m.created_at);
    var time = date.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    html += '<div class="chat-message ' + (isOwn ? 'chat-message-own' : 'chat-message-other') + '">';
    html += '<div class="chat-message-author">' + m.author_name + '</div>';
    html += '<div class="chat-message-text">' + escapeHtml(m.text) + '</div>';
    html += '<div class="chat-message-time">' + time + '</div>';
    if (isOwn) {
      html += '<button class="chat-delete-btn" onclick="deleteMessage(' + m.id + ')">✕</button>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
  if (wasAtBottom) {
    container.scrollTop = container.scrollHeight;
  }
}

function sendMessage() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  var btn = document.getElementById('chatSendBtn');
  btn.disabled = true;
  fetch('/api/chat/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ text: text }),
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    input.value = '';
    btn.disabled = false;
    loadMessages();
  })
  .catch(function() {
    btn.disabled = false;
  });
}

function deleteMessage(id) {
  if (!confirm('Удалить сообщение?')) return;
  fetch('/api/chat/messages/' + id, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) {
    if (r.ok) loadMessages();
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadUserId);
</script>
{% endblock %}
