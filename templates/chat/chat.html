{% extends 'base.html' %}

{% block title %}Чат{% endblock %}

{% block content %}
<div class="chat-layout">
  <div class="chat-header">
    <h2>Общий чат</h2>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area" style="position:relative;">
    <div id="emojiPicker" class="emoji-picker" style="display:none;"></div>
    <button type="button" onclick="toggleEmojiPicker()" style="flex-shrink:0; width:42px; height:42px; padding:0; border:1px solid #ddd; border-radius:50%; background:#f8f9fa; cursor:pointer; font-size:20px; line-height:42px; text-align:center;">😊</button>
    <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" style="flex:1;">
    <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">Отправить</button>
  </div>
</div>
{% endblock %}

{% block extrajs %}
<script>
var currentUserId = null;
var pollInterval = null;

function loadUserId() {
  fetch('/api/auth/me', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(user) {
    currentUserId = user.id;
    loadMessages();
    pollInterval = setInterval(loadMessages, 3000);
  });
}

function loadMessages() {
  fetch('/api/chat/messages?per_page=100', {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderMessages(data.messages || data);
  });
}

function renderMessages(messages) {
  var container = document.getElementById('chatMessages');
  var wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;
  if (!messages || messages.length === 0) {
    container.innerHTML = '<div class="chat-empty">Сообщений пока нет</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    var isOwn = m.author_id === currentUserId;
    var date = new Date(m.created_at);
    var time = date.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    html += '<div class="chat-message ' + (isOwn ? 'chat-message-own' : 'chat-message-other') + '">';
    html += '<div class="chat-message-author">' + m.author_name + '</div>';
    html += '<div class="chat-message-text">' + escapeHtml(m.text) + '</div>';
    html += '<div class="chat-message-time">' + time + '</div>';
    if (isOwn) {
      html += '<button class="chat-delete-btn" onclick="deleteMessage(' + m.id + ')">✕</button>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
  if (wasAtBottom) {
    container.scrollTop = container.scrollHeight;
  }
}

function sendMessage() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  var btn = document.getElementById('chatSendBtn');
  btn.disabled = true;
  fetch('/api/chat/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ text: text }),
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    input.value = '';
    btn.disabled = false;
    loadMessages();
  })
  .catch(function() {
    btn.disabled = false;
  });
}

function deleteMessage(id) {
  if (!confirm('Удалить сообщение?')) return;
  fetch('/api/chat/messages/' + id, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
  })
  .then(function(r) {
    if (r.ok) loadMessages();
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', function() {
  loadUserId();
  buildEmojiPicker();
});

var emojis = ['😀','😁','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😗','😋','😛','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','😐','😑','😶','😏','😒','🙄','😬','😮','😯','😲','😳','🥺','😢','😭','😤','😡','🤬','😈','👍','👎','👊','✊','🤘','👌','✌','🤞','💪','🤝','🙏','❤','💔','🔥','⭐','✅','❌','🎉','🎊','🚀','💡','📌','🎯','💯','👏','🤩','🥳','💀','☠','👋','✋','🙌','🤲','🤜','🤛','🧠','👀','👅','💋'];

function buildEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  for (var i = 0; i < emojis.length; i++) {
    var span = document.createElement('span');
    span.textContent = emojis[i];
    span.onclick = function() { insertEmoji(this.textContent); };
    picker.appendChild(span);
  }
}

function toggleEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  picker.style.display = picker.style.display === 'none' ? 'grid' : 'none';
}

function insertEmoji(emoji) {
  var input = document.getElementById('chatInput');
  input.value += emoji;
  input.focus();
  document.getElementById('emojiPicker').style.display = 'none';
}

document.addEventListener('click', function(e) {
  var picker = document.getElementById('emojiPicker');
  var btn = document.querySelector('.chat-input-area button:first-child');
  if (picker.style.display !== 'none' && !picker.contains(e.target) && !btn.contains(e.target)) {
    picker.style.display = 'none';
  }
});
</script>
{% endblock %}
