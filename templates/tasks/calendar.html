{% extends 'base.html' %}
{% block extracss %}
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js'></script>
  <script src=" https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.19/index.global.min.js "></script>
  <script src=" https://cdn.jsdelivr.net/npm/@fullcalendar/list@6.1.19/index.global.min.js "></script>
  <script>

      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          events: {{tasks | tojson}},
          selectable: true,
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: ''
            //right: 'dayGridMonth,listMonth'
          },
        });
        calendar.render();
        calendar.setOption('locale', 'ru');
        calendar.setOption('buttonText', {
            today:    'Сегодня',
            month:    'Месяц',
            week:     'Неделя',
            day:      'День',
            list:     'Список'
          })
      });

    </script>
  <style>
    /* Настройки для календаря */
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
  {% endblock %}

  {% block content %}
  <div class="container">
    <h2>Календарь задач</h2>
    <div id="calendar"></div>
  </div>
  {% endblock %}

  {% block extrajs %}
  {% endblock %}
